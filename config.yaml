# JARVIS AI Assistant Configuration
# ==================================

# Assistant Settings
assistant:
  name: "JARVIS"
  wake_word: "jarvis"
  voice_rate: 175
  voice_volume: 1.0
  voice_id: null  # null = default voice

# Speech Recognition Settings
speech:
  recognizer: "google"  # Options: google, whisper,sphinx
  language: "en-US"
  ambient_noise_adjustment: true
  timeout: 5
  phrase_time_limit: 10

# Text-to-Speech Settings
tts:
  engine: "pyttsx3"  # Options: pyttsx3, gtts, edge
  use_gtts: false    # Use Google TTS for better voices
  use_edge: true     # Use Edge Neural voices (best quality)
  edge_voice: "en-US-GuyNeural"  # Neural voice

# AI Settings
ai:
  provider: "openai"  # Options: openai, anthropic, local
  model: "gpt-3.5-turbo"  # GPT-3.5 or gpt-4
  api_key: "${OPENAI_API_KEY}"
  max_tokens: 500
  temperature: 0.7

# Web Services
services:
  weather:
    provider: "openweathermap"
    api_key: "${OPENWEATHER_API_KEY}"
    default_location: "New York"
  
  news:
    provider: "newsapi"
    api_key: "${NEWS_API_KEY}"
    country: "us"
  
  wolfram:
    api_key: "${WOLFRAM_API_KEY}"

# System Settings
system:
  check_battery: true
  low_battery_threshold: 20
  auto_update: false

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "jarvis.log"
  max_size: "10MB"
  backup_count: 5

# GUI Settings (optional)
gui:
  enabled: false
  theme: "dark"
  color: "#00FFFF"  # Cyan color like JARVIS
